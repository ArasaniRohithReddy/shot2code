appId: com.arasanirohithreddy.shot2code
productName: shot2code
copyright: Copyright (c) 2026 Arasani Rohith Reddy

directories:
  output: dist
  buildResources: build

# main.js, preload.js and the Vite build staged into renderer/
files:
  - main.js
  - preload.js
  - renderer/**/*
  - package.json

# The PyInstaller output is staged into backend-dist/ by the build script and
# lands in resources/backend, which main.js looks for when packaged.
extraResources:
  - from: backend-dist
    to: backend
    filter:
      - "**/*"

publish:
  provider: github
  owner: ArasaniRohithReddy
  repo: shot2code
  releaseType: release

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: shot2code
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

msi:
  oneClick: false
  perMachine: false
  # Note: building the MSI locally can fail with LGHT1105 ("Validation could
  # not run due to system policy") on locked-down machines, because WiX ICE
  # validation needs elevated rights. CI runners are unrestricted, so the MSI
  # is produced there. Use the NSIS .exe or the portable .zip locally.

# Chromium is bundled inside the PyInstaller payload, so the installer is large.
# Skip compression tuning that would make the build far slower for little gain.
compression: normal
