[project]
name = "shot2code-backend"
version = "0.1.0"
description = "shot2code backend - converts screenshots, mockups and recordings into code"
authors = [{ name = "Arasani Rohith Reddy" }]
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115.6,<0.116.0",
    "uvicorn>=0.25.0,<0.26.0",
    "websockets>=14.1,<15.0",
    "openai==2.16.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "beautifulsoup4>=4.12.2,<5.0.0",
    "httpx>=0.28.1,<0.29.0",
    "pre-commit>=3.6.2,<4.0.0",
    "anthropic>=0.84.0,<0.85.0",
    "moviepy>=1.0.3,<2.0.0",
    "pillow>=10.3.0,<11.0.0",
    "types-pillow>=10.2.0.20240520,<11.0.0",
    "aiohttp>=3.9.5,<4.0.0",
    "pydantic>=2.10,<3.0",
    "google-genai>=1.16.1,<2.0.0",
    "langfuse>=3.0.2,<4.0.0",
    "playwright>=1.61.0,<2.0.0",
    "pillow-heif>=0.18.0,<0.19.0",
    "github-copilot-sdk>=1.0.11,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3,<8.0.0",
    "pyright>=1.1.352,<2.0.0",
    "pytest-asyncio>=0.21,<0.22",
    "pyinstaller>=6.11.0,<7.0.0",
]

[tool.uv]
package = false
