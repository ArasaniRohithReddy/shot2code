name: Build desktop app

# Validates that the desktop app still packages. Releases themselves are cut
# from a locally verified build, because CI publishing raced with that and left
# releases in an inconsistent state.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Freeze backend with PyInstaller
        working-directory: backend
        run: |
          uv run pyinstaller shot2code-backend.spec --noconfirm --distpath dist-pyinstaller

      - name: Bundle Chromium for the screenshot preview tool
        working-directory: backend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\backend\dist-pyinstaller\shot2code-backend\ms-playwright
        # Only the headless shell: the app always launches headless, and the
        # full headed Chromium would add ~427MB to the installer for nothing.
        run: uv run playwright install chromium-headless-shell

      - name: Stage payloads for electron-builder
        shell: pwsh
        run: |
          $desktop = "desktop"
          Remove-Item -Recurse -Force "$desktop/renderer","$desktop/backend-dist" -ErrorAction SilentlyContinue
          Copy-Item -Recurse frontend/dist "$desktop/renderer"
          Copy-Item -Recurse backend/dist-pyinstaller/shot2code-backend "$desktop/backend-dist"
          "renderer files: $((Get-ChildItem "$desktop/renderer" -Recurse -File).Count)"
          "backend files:  $((Get-ChildItem "$desktop/backend-dist" -Recurse -File).Count)"

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        working-directory: desktop
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $v
          $pkg | ConvertTo-Json -Depth 20 | Set-Content package.json
          "version set to $v"

      - name: Build installers
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          npm install
          # Never publish from CI. electron-builder skips re-uploading an
          # existing asset but still replaces latest.yml, which left releases
          # with a manifest describing a binary that was no longer there and
          # broke auto-update. Releases are published from a locally verified
          # build; this job exists to catch breakage.
          npx electron-builder --win nsis msi zip --publish never

      - name: Report artifact sizes
        if: always()
        shell: pwsh
        working-directory: desktop
        run: |
          # The installers are far too large for actions/upload-artifact, so
          # just record that they built and how big they are.
          Get-ChildItem dist -File |
            Where-Object { $_.Extension -in '.exe', '.msi', '.zip' } |
            ForEach-Object { "{0,7} MB  {1}" -f [int]($_.Length / 1MB), $_.Name }
